<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino - Práctica de Ruleta</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <div class="phone-shell">
        <div class="card">
            <h1>Práctica de Ruleta</h1>
            <div id="feedback" class="feedback"></div>
            <div class="question-timer hidden" id="questionTimer">10s</div>
            <div class="question" id="questionDisplay">?</div>
            <div class="answer-row">
                <input type="number" id="answerInput" placeholder="Tu respuesta..." autocomplete="off">
                <button class="btn-submit" id="submitBtn" aria-label="Enviar apuesta">Enviar</button>
            </div>
            <div class="sections-divider"></div>
            <div class="modes-container">
                <div>
                    <div class="section-title">Modos de práctica</div>
                    <div class="main-modes">
                        <button class="btn-mode active" id="btnNormal">Normal</button>
                        <button class="btn-mode" id="btnErrors">Mis errores (<span id="errorCount">0</span>)</button>
                        <button class="btn-mode" id="btnTimer">Contra reloj</button>
                    </div>
                </div>
                <div style="margin-top: 1rem;">
                    <div class="section-title">Seleccionar tablas</div>
                    <div class="tables-grid" id="tablesGrid"></div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav" aria-label="Menú inferior">
            <button class="nav-item nav-home active" data-nav="home" aria-label="Inicio">
                <img src="img/x_15538955.png" alt="Inicio" class="nav-image" />
            </button>
            <button class="nav-item nav-pet" data-nav="soon" aria-label="Mascota">2</button>
            <button class="nav-item nav-chest" data-nav="soon" aria-label="Cofre">3</button>
            <button class="nav-item nav-heart" data-nav="soon" aria-label="Favoritos">4</button>
            <button class="nav-item nav-more" id="customizeButton" aria-label="Más">
                <img src="img/star.png" alt="Botón personalizado" class="nav-image" />
            </button>
        </nav>
    </div>

    <div class="soon-overlay" id="soonOverlay" aria-hidden="true">
        <div class="soon-panel" role="dialog" aria-modal="true" aria-labelledby="soonTitle">
            <div class="panel-header">
                <h2 id="soonTitle">Próximamente</h2>
                <button class="close-button" id="closeSoon" aria-label="Cerrar">✕</button>
            </div>
            <p class="soon-text">Esta sección estará disponible pronto.</p>
        </div>
    </div>

    <div class="theme-preview-badge hidden" id="themePreviewBadge" aria-live="polite">5s</div>

    <div class="personalizer-overlay" id="personalizerOverlay" aria-hidden="true">
        <div class="personalizer-panel" role="dialog" aria-modal="true" aria-labelledby="personalizerTitle">
            <div class="panel-header">
                <h2 id="personalizerTitle">Temas</h2>
                <button class="close-button" id="closePersonalizer" aria-label="Cerrar temas">✕</button>
            </div>

            <div class="theme-section-header">
                <span>Selecciona un tema</span>
                <span class="theme-preview-hint" id="themePreviewStatus">Elige un tema</span>
            </div>
            <div class="theme-presets" id="themePresets"></div>
        </div>
    </div>

    <script src="script.js?v=4"></script>
</body>
</html>
